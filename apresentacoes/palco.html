<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITULO__ · palco</title>
<style>
  :root { --papel: #000; --tinta: #F2F5F3; --tinta-2: #A8B0AC; --marca: __COR__; --mono: "JetBrains Mono", ui-monospace, Menlo, monospace; --sans: "Chakra Petch", system-ui, -apple-system, sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--papel); color: var(--tinta); font: 14px/1.4 var(--sans); overflow: hidden; }
  #palco { position: relative; width: 100vw; height: 100vh; background: var(--papel); cursor: none; }
  #palco.com-mouse { cursor: default; }
  #tela { position: absolute; inset: 0; margin: auto; aspect-ratio: 16 / 9; max-width: 100%; max-height: 100%; background: #16181A; }
  #tela video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: none; background: #16181A; }
  #tela video.atual { display: block; }
  #hud { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 14px; padding: 12px 18px;
         background: linear-gradient(180deg, transparent, rgba(0,0,0,0.75)); opacity: 0; transition: opacity .25s; pointer-events: none; }
  #palco.com-mouse #hud { opacity: 1; pointer-events: auto; }
  #hud .titulo { font-weight: 600; letter-spacing: .02em; } #hud .titulo span { color: var(--marca); }
  #hud .marca { color: var(--tinta-2); font-family: var(--mono); font-size: 12px; text-transform: uppercase; letter-spacing: .1em; }
  #hud .espaco { flex: 1; }
  #hud button { border: 1px solid rgba(255,255,255,0.25); background: rgba(0,0,0,0.4); color: var(--tinta); border-radius: 8px; padding: 7px 12px; font: 600 12px var(--mono); cursor: pointer; }
  #hud button:hover { border-color: var(--marca); color: var(--marca); }
  #contador { position: absolute; top: 14px; right: 18px; font: 600 13px var(--mono); color: var(--tinta-2); letter-spacing: .12em; opacity: .85; }
  #dica { position: absolute; top: 14px; left: 18px; font: 12px var(--mono); color: var(--tinta-2); opacity: 0; transition: opacity .25s; }
  #palco.com-mouse #dica { opacity: .8; }
  .barra { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--marca); width: 0; transition: width .2s; }
</style>
</head>
<body>
<div id="palco" class="com-mouse" tabindex="0" aria-label="__TITULO__">
  <div id="tela">
__VIDEOS__
    <div class="barra" id="barra"></div>
  </div>
  <div id="dica">← → trocam de slide · F tela cheia · R repete a animação · Esc sai</div>
  <div id="contador" aria-live="polite">01 / __TOTAL__</div>
  <div id="hud">
    <div class="titulo">__TITULO__<span>.</span></div>
    <div class="marca">__MARCA__</div>
    <div class="espaco"></div>
    <button type="button" data-acao="repetir" title="Repete a animação do slide (R)">↻ Repetir (R)</button>
    <button type="button" data-acao="tela-cheia" title="Tela cheia (F)">⛶ Tela cheia (F)</button>
  </div>
</div>
<script>
(function () {
  var palco = document.getElementById("palco"), tela = document.getElementById("tela");
  var videos = Array.prototype.slice.call(tela.querySelectorAll("video"));
  var total = videos.length, atual = -1, somem = null;
  var contador = document.getElementById("contador"), barra = document.getElementById("barra");
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function mostra(i, repetir) {
    if (i < 0 || i >= total) return;
    if (i === atual && !repetir) return;
    if (atual >= 0 && atual !== i) { videos[atual].pause(); videos[atual].classList.remove("atual"); }
    atual = i;
    var v = videos[i];
    v.classList.add("atual");
    try { v.currentTime = 0; } catch (e) {}
    var p = v.play(); if (p && p.catch) p.catch(function () {});
    if (videos[i + 1]) videos[i + 1].preload = "auto";
    contador.textContent = pad(i + 1) + " / " + pad(total);
    barra.style.width = ((i + 1) / total * 100) + "%";
    if (history.replaceState) history.replaceState(null, "", "#" + (i + 1));
  }
  function telaCheia() {
    var el = document.fullscreenElement || document.webkitFullscreenElement;
    if (el) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
    var pede = palco.requestFullscreen || palco.webkitRequestFullscreen;
    if (pede) { var r = pede.call(palco); if (r && r.catch) r.catch(function () {}); }
  }
  document.addEventListener("keydown", function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key;
    if (k === "ArrowRight" || k === " " || k === "PageDown" || k === "Enter") { e.preventDefault(); mostra(atual + 1); }
    else if (k === "ArrowLeft" || k === "PageUp" || k === "Backspace") { e.preventDefault(); mostra(atual - 1); }
    else if (k === "Home") { e.preventDefault(); mostra(0); }
    else if (k === "End") { e.preventDefault(); mostra(total - 1); }
    else if (k === "f" || k === "F") { e.preventDefault(); telaCheia(); }
    else if (k === "r" || k === "R") { e.preventDefault(); mostra(atual, true); }
  });
  palco.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("button[data-acao]") : null;
    if (b) { if (b.dataset.acao === "tela-cheia") telaCheia(); else mostra(atual, true); return; }
    if (e.target.closest && e.target.closest("#hud")) return;
    var meio = palco.getBoundingClientRect().left + palco.clientWidth / 2;
    mostra(e.clientX < meio ? atual - 1 : atual + 1);
  });
  function acordaMouse() {
    palco.classList.add("com-mouse");
    clearTimeout(somem);
    somem = setTimeout(function () { palco.classList.remove("com-mouse"); }, 3000);
  }
  palco.addEventListener("mousemove", acordaMouse);
  acordaMouse();
  var inicial = parseInt((location.hash || "#1").slice(1), 10);
  mostra(isNaN(inicial) ? 0 : Math.min(Math.max(inicial - 1, 0), total - 1));
  palco.focus();
})();
</script>
</body>
</html>
